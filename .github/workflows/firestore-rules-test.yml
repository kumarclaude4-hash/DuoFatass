name: Firestore Rules Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - 'server/**'
      - '.github/workflows/firestore-rules-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - 'server/**'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-test:
    name: Test Firestore Rules and server transactions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21 (required by Firebase emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            firestore-tests/package-lock.json
            server/package-lock.json

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Install Firestore rules test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install server test dependencies
        working-directory: server
        run: npm ci

      # App Check is enforced by Firebase before Rules evaluation. Keep a source
      # guard against unsupported request.app expressions outside the emulator.
      - name: App Check Rules-language boundary guard
        working-directory: firestore-tests
        run: npx jest appcheck-static.test.js --runInBand

      # The emulator suite loads the exact committed Firestore Rules. It does not
      # simulate Firebase Console App Check enforcement or mint App Check tokens.
      # Server integration separately exercises durable Admin SDK transactions.
      - name: Run rules and server integration suites on one isolated emulator
        working-directory: firestore-tests
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          GCLOUD_PROJECT: 'duoshield-test'
          DUOSHIELD_REQUIRE_FIRESTORE_EMULATOR: '1'
        run: |
          firebase emulators:exec \
            --only firestore \
            --project duoshield-test \
            --config ../firebase.json \
            "npm test && cd ../server && npm run test:firestore-integration"

      - name: Upload Firestore test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rules-test-results
          path: firestore-tests/junit.xml
          if-no-files-found: ignore
          retention-days: 14
