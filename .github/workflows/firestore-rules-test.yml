name: Firestore Rules Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
      - 'server/lib/adminSessionStore*'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/firestore-rules-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
      - 'server/lib/adminSessionStore*'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch:

jobs:
  rules-test:
    name: Test Firestore Rules and durable admin sessions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21 (required by Firebase emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            firestore-tests/package-lock.json
            server/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.26.0

      - name: Install Firestore rules test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install server test dependencies
        working-directory: server
        run: npm ci

      # Suite C: static App Check policy guard. Keep it separate so a missing
      # gate fails even if the emulator itself is unavailable.
      - name: Static App Check gate guard (Suite C)
        working-directory: firestore-tests
        run: npx jest appcheck-static.test.js

      # Suites A + B validate client security rules. The server integration
      # suite in the same emulator process exercises real Admin SDK transactions
      # across independent admin-session store instances; mocks alone cannot
      # prove the cross-instance generation/revocation contract.
      - name: Start Firestore emulator and run rules + server integration tests
        working-directory: firestore-tests
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          GCLOUD_PROJECT: 'duoshield-test'
          DUOSHIELD_REQUIRE_FIRESTORE_EMULATOR: '1'
        run: |
          firebase emulators:exec \
            --only firestore \
            --project duoshield-test \
            "npm test && cd ../server && npm run test:firestore-integration" \
            2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rules-test-results
          path: firestore-tests/junit.xml
          if-no-files-found: ignore
          retention-days: 14
