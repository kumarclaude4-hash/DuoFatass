name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'testing-release/**'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Existing version tag to build (e.g. v1.4.1). Must point to this workflow commit.'
        required: true
        type: string

# Version tags are immutable release identifiers. Do not cancel a release already in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write      # create/update releases and tags
  # SC-04: required by actions/attest-build-provenance. `id-token` mints the
  # OIDC token that identifies this workflow run to the attestation service;
  # `attestations` stores the resulting signed provenance. Both are the minimum
  # for that action — no other scope is added.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest
    environment: production-release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      # SC-01: the release build ships the vendored libsignal JAR to users, so the
      # integrity gate must run here too — not only in ci.yml. A release is
      # exactly the moment a swapped crypto core would do the most damage: it is
      # signed with the real keystore and published for sideload. Fail before the
      # keystore is ever decoded. See the job comment in ci.yml for the full
      # rationale and scripts/strip_signal_records.py for the recorded hash.
      - name: Assert vendored libsignal JAR matches recorded hash (SC-01)
        run: python3 scripts/strip_signal_records.py --check

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required for a release build."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # S08-C1: no service-account.json is written into app/src/main/assets any
      # more. That step used to place the project's Firebase **admin** private
      # key inside the packaged APK, where `unzip -p app.apk assets/…` recovered
      # full Admin SDK authority over every user's Firestore data and Auth
      # tokens from a public download. No application code ever read the file —
      # verified by grepping app/src for `service-account` — so the step existed
      # purely as a leak. Admin credentials live only on the push server (Render
      # env) and the Cloudflare Worker. Never reintroduce this step: an APK is a
      # public artifact, so anything written into it is published, not stored.
      #
      # SC-02 / S08-H1: the release local.properties below deliberately carries
      # NO secret material either — only non-secret endpoints. B2 keys and
      # WORKER_SECRET used to be injected here and compiled into BuildConfig,
      # which shipped the shared storage credential to every device. Media
      # access is now brokered by per-object capability tokens minted by the
      # push server (SEC-A01, see B2StorageHelper), so the client needs neither.
      #
      # Rule for this file: a value may only be written into local.properties if
      # it would be safe to print on the release page. If it must stay secret,
      # it belongs in a server env var and must be reached over an authenticated
      # endpoint at runtime.
      - name: Write local.properties (non-secret values only)
        env:
          B2_BUCKET:       ${{ secrets.B2_BUCKET }}
          B2_REGION:       ${{ secrets.B2_REGION }}
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          WORKER_URL:      ${{ secrets.WORKER_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"                                                     > local.properties
          echo "b2.bucket=${B2_BUCKET:-duoshield-cold}"                                       >> local.properties
          echo "b2.region=${B2_REGION:-eu-central-003}"                                       >> local.properties
          echo "push.server.url=${PUSH_SERVER_URL:-https://duofat.onrender.com}"              >> local.properties
          echo "worker.url=${WORKER_URL:-https://duoshield-storage.kumarclaude4.workers.dev}" >> local.properties

      # Fail the release if any known secret name reached a packaged input.
      # This is the enforcement half of the rule above: comments do not stop a
      # future edit from re-adding an injection step, a failing build does.
      - name: Assert no secrets in packaged build inputs
        run: |
          set -u
          fail=0
          # Note: `set -e` is deliberately NOT used. Under `-e` a missing
          # local.properties would abort this step before any check ran, so the
          # guard would be skipped rather than enforced — the failure mode a
          # secret check must never have. Every condition is tested explicitly
          # and the exit status is decided at the end.
          if [ ! -f local.properties ]; then
            echo "::error::local.properties is missing — cannot verify the build carries no secrets."
            exit 1
          fi
          if [ -f app/src/main/assets/service-account.json ]; then
            echo "::error::app/src/main/assets/service-account.json exists — admin credentials must never be packaged (S08-C1)."
            fail=1
          fi
          # `=.` requires at least one character after the `=`, so a key written
          # with an empty value (the `${VAR:-}` default) is correctly allowed
          # while any real value trips the guard.
          for key in b2.key.id b2.application.key worker.secret; do
            if grep -q "^${key}=." local.properties; then
              echo "::error::local.properties sets ${key} — client builds must not carry shared secrets (SC-02)."
              fail=1
            fi
          done
          # Catch a credential smuggled in under any other key name: B2
          # application keys are long opaque strings, and a Google private key
          # block is unmistakable.
          if grep -qi "BEGIN [A-Z ]*PRIVATE KEY" local.properties; then
            echo "::error::local.properties contains a private key block."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: no packaged secret material detected."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign release APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/duoshield-release.keystore

      - name: Build signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # ── SC-04: make the published APKs verifiable ────────────────────────────
      # DuoShield is sideloaded from a URL, so a user installing it has no store
      # to vouch for the bytes they received. Previously the release attached raw
      # APKs and nothing else: no checksums, no signing-certificate fingerprint,
      # no provenance. A user could not tell the maintainer's build from a
      # substituted one, and after an incident there was no record tying a
      # shipped APK to the commit that produced it.
      #
      # Android's signature check only protects *upgrades* (it refuses an update
      # signed by a different key). A first install has nothing to compare
      # against — which is the case that matters for a security app people are
      # told to sideload. Publishing the certificate digest gives that first
      # install something to verify against.
      #
      # This runs BEFORE the keystore is erased below, because apksigner needs
      # only the APK (not the keystore) — the cert is embedded in the signed
      # artifact. Order still matters for the step *after* it, so keep the erase
      # step last among the post-build steps.
      - name: Generate SHA256SUMS and record signing certificate
        id: verify
        run: |
          set -uo pipefail
          APK_DIR=app/build/outputs/apk/release
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::$APK_DIR does not exist — the build produced no APKs to publish."
            exit 1
          fi
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs found in $APK_DIR — refusing to publish an empty release."
            exit 1
          fi

          # The APK intentionally keeps production JNI libraries uncompressed so
          # Android 13 can mmap them directly instead of extracting a second copy.
          # For bandwidth-limited sideloading, wrap each already-signed APK in a
          # lossless ZIP. This reduces downloads below 50 MB without changing a
          # byte of the installable APK or sacrificing call/encryption behavior.
          for apk in "${APKS[@]}"; do
            archive="${apk%.apk}.zip"
            rm -f "$archive"
            if ! zip -9 -j "$archive" "$apk"; then
              echo "::error::Failed to create $archive."
              exit 1
            fi
            if ! unzip -t "$archive" >/dev/null; then
              echo "::error::$archive failed integrity validation."
              exit 1
            fi
          done

          # Checksums use bare filenames so `sha256sum -c SHA256SUMS` works in
          # whatever directory a user downloads into. Include both original APKs
          # and compact ZIP delivery artifacts.
          #
          # Failure here must fail the release. Publishing an empty or partial
          # SHA256SUMS would be worse than publishing none: it looks like
          # verification is available while actually verifying nothing.
          if ! ( cd "$APK_DIR" && sha256sum *.apk *.zip > SHA256SUMS ); then
            echo "::error::sha256sum failed — refusing to publish a release without valid checksums."
            exit 1
          fi
          if [ ! -s "$APK_DIR/SHA256SUMS" ]; then
            echo "::error::SHA256SUMS is empty — refusing to publish unverifiable APKs."
            exit 1
          fi
          echo "SHA256SUMS:"
          cat "$APK_DIR/SHA256SUMS"

          # Signing certificate digest, pinned publicly in the release body so a
          # fresh install can be checked with:
          #   apksigner verify --print-certs app-arm64-v8a-release.apk
          # Newest build-tools copy of apksigner. ANDROID_SDK_ROOT may be unset on
          # a runner image change, so guard the lookup rather than letting `find`
          # error out and take the step with it.
          APKSIGNER=""
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "${ANDROID_SDK_ROOT}/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          {
            echo "### SHA-256 checksums"
            echo '```'
            cat "$APK_DIR/SHA256SUMS"
            echo '```'
          } > release-verify.md

          if [ -n "$APKSIGNER" ]; then
            CERT_SHA=$("$APKSIGNER" verify --print-certs "${APKS[0]}" 2>/dev/null \
              | grep -i 'certificate SHA-256 digest' | head -1 | awk -F': ' '{print $2}')
          else
            echo "::warning::apksigner not found under ANDROID_SDK_ROOT — cannot read the signing certificate digest."
            CERT_SHA=""
          fi

          if [ -n "${CERT_SHA:-}" ]; then
            echo "Signing certificate SHA-256: ${CERT_SHA}"
            {
              echo ""
              echo "### Signing certificate"
              echo "All APKs in this release are signed with the certificate:"
              echo '```'
              echo "SHA-256: ${CERT_SHA}"
              echo '```'
              echo "Verify a download with \`apksigner verify --print-certs <file>.apk\` and confirm this digest matches."
            } >> release-verify.md
          else
            # Never claim a fingerprint that was not actually read from the APK.
            echo "::warning::Could not extract the signing certificate digest; release body will omit it."
          fi

          echo "apk_dir=${APK_DIR}" >> $GITHUB_OUTPUT

      # Signed, tamper-evident provenance tying each APK to this exact workflow
      # run, commit, and repository. Verifiable with:
      #   gh attestation verify <file>.apk --repo ${{ github.repository }}
      # This is what lets someone confirm an APK came from this pipeline rather
      # than from anyone who can upload to a release page.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: app/build/outputs/apk/release/*.apk

      - name: Erase keystore from runner disk
        if: always()
        run: rm -f app/duoshield-release.keystore

      # Stable releases require an existing immutable v* tag that exactly
      # matches app/build.gradle. Testing branches instead receive a unique
      # test-v* prerelease tag after the signed build has completed.
      - name: Resolve and validate immutable release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.version_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | grep -oP '"\K[^"]+')

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            PRERELEASE=false
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            PRERELEASE=false
          elif [ "$REF_TYPE" = "branch" ] && [[ "$REF_NAME" == testing-release/* ]]; then
            # Test releases use a namespace outside v* so they cannot invoke the
            # stable release trigger. The short commit SHA makes every test tag
            # unique and ties the public prerelease to this exact build.
            TAG="test-v${VERSION_NAME}-${WORKFLOW_SHA:0:7}"
            PRERELEASE=true
          else
            echo "::error::Release workflow must run from a version tag, manual dispatch, or testing-release/* branch."
            exit 1
          fi

          if [[ "$PRERELEASE" = "false" ]]; then
            # The application uses numeric version components (for example 1.4).
            # Keep stable releases pinned to the exact app version and an existing tag.
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid stable release tag: $TAG"
              exit 1
            fi

            TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')
            TAG_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.type')
            if [ "$TAG_TYPE" = "tag" ]; then
              TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_COMMIT" --jq '.object.sha')
            fi

            if [ "$TAG_COMMIT" != "$WORKFLOW_SHA" ]; then
              echo "::error::Tag $TAG points to $TAG_COMMIT but workflow checked out $WORKFLOW_SHA."
              exit 1
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists. Version releases are immutable; bump versionName and create a new tag."
              exit 1
            fi

            EXPECTED_TAG="v${VERSION_NAME}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag $TAG does not match app versionName $VERSION_NAME."
              exit 1
            fi
          else
            if [[ ! "$TAG" =~ ^test-v[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9a-f]{7}$ ]]; then
              echo "::error::Invalid testing prerelease tag: $TAG"
              exit 1
            fi

            # Test tags are created by the release action only after a successful
            # build. Refuse collisions rather than reusing or moving a prior tag.
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Testing tag $TAG already exists. Create a new testing commit instead of reusing it."
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Testing prerelease $TAG already exists."
              exit 1
            fi
          fi

          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Validated immutable ${PRERELEASE} release tag $TAG at $WORKFLOW_SHA."

      # ── Compose the release body (install + SC-04 verification data) ─────────
      # Built as a file rather than an inline `body:` string so the checksums and
      # certificate digest produced above can be interpolated verbatim, without
      # passing untrusted-looking multi-line content through YAML quoting.
      - name: Compose release body
        run: |
          set -u
          cat > release-verify-body.md <<'EOF'
          ## Installation

          Pick the download for your device architecture:

          | Compact download | Installable APK inside | Architecture | Devices |
          |---|---|---|---|
          | `app-arm64-v8a-release.zip` | `app-arm64-v8a-release.apk` | 64-bit | Most phones from 2017 onwards |
          | `app-armeabi-v7a-release.zip` | `app-armeabi-v7a-release.apk` | 32-bit | Older / budget devices |

          The ZIP is a lossless bandwidth-saving wrapper around the signed APK. Extract it,
          enable **Install from unknown sources** in Settings → Security, then tap the APK.
          The original APK files remain attached for users who prefer direct downloads.

          ## Verifying this download

          DuoShield is sideloaded, so nothing checks these bytes for you on a first
          install. Verify before installing:

          1. **Checksum** — download `SHA256SUMS` next to the APKs and run
             `sha256sum -c SHA256SUMS` (or compare `sha256sum <file>.apk` to the list below).
          2. **Provenance** — confirm the APK was built by this repository's release
             workflow:
             `gh attestation verify <file>.apk --repo ${{ github.repository }}`
          3. **Signature** — check the signing certificate digest published below with
             `apksigner verify --print-certs <file>.apk`.

          EOF

          if [ -f release-verify.md ]; then
            cat release-verify.md >> release-verify-body.md
          else
            echo "::warning::release-verify.md missing — release body will omit checksums."
          fi

          {
            echo ""
            echo "---"
            echo "Built from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\` by workflow run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> release-verify-body.md

          echo "----- release body -----"
          cat release-verify-body.md

      # Keep a downloadable testing artifact separate from the public
      # prerelease. It is available from this workflow run for 30 days.
      - name: Upload signed testing APK artifact
        if: steps.tag.outputs.prerelease == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DuoShield-testing-${{ steps.tag.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.zip
            app/build/outputs/apk/release/SHA256SUMS
            release-verify.md
            release-verify-body.md
          if-no-files-found: error
          retention-days: 30

      # ── Publish the new release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name:             ${{ steps.tag.outputs.name }}
          target_commitish:     ${{ github.sha }}
          name:                 "DuoShield ${{ steps.tag.outputs.name }}"
          prerelease:           ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest:          ${{ steps.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          # SC-04: `body_path` carries the generated checksums + certificate
          # digest, so the verification data is published on the release page
          # itself rather than living only in a build log.
          body_path: release-verify-body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.zip
            app/build/outputs/apk/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
