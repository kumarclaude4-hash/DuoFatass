name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.3.1). Leave blank to use versionName from build.gradle.'
        required: false
        type: string

# Only one release job runs at a time; a newer push cancels an in-progress build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create/delete releases and tags

jobs:
  release:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required for a release build."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # S08-C1 / SC-02 FIX: The Firebase Admin service-account private key must
      # NEVER be written into app/src/main/assets/ — Android packages assets/
      # verbatim so the key would ship in every published APK, giving anyone who
      # downloads the APK full Admin SDK authority over the entire Firestore
      # database, bypassing all Firestore Security Rules.
      #
      # The service-account key is a SERVER-ONLY credential. It belongs in the
      # server's runtime environment (Render / Cloud Run env var), not in the
      # Android client build at all. The Android app never needs Admin SDK access;
      # it communicates with the push server over the verified /mintToken and
      # related endpoints, which perform all Admin SDK calls server-side.
      #
      # The Write service-account.json step has been permanently removed.
      # If any Firebase initialisation code in the app still reads this file,
      # that code must be removed — the app uses the google-services.json
      # configuration (non-privileged client config) for Firebase client SDK init.

      - name: Write local.properties
        env:
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          WORKER_URL:      ${{ secrets.WORKER_URL }}
        run: |
          # SC-02 FIX: B2_KEY_ID, B2_APPLICATION_KEY, and WORKER_SECRET are
          # server-side / Worker-side secrets. They must NOT be compiled into the
          # Android APK via BuildConfig. The client communicates with the Worker
          # through per-object capability tokens minted by the push server; it
          # never needs a shared B2 or Worker credential.
          #
          # Only genuinely non-secret public-endpoint URLs are written here.
          echo "sdk.dir=$ANDROID_SDK_ROOT"                                                     > local.properties
          echo "push.server.url=${PUSH_SERVER_URL:-https://duofat.onrender.com}"              >> local.properties
          echo "worker.url=${WORKER_URL:-https://duoshield-storage.kumarclaude4.workers.dev}" >> local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign release APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/duoshield-release.keystore

      - name: Build signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Erase keystore from runner disk
        if: always()
        run: rm -f app/duoshield-release.keystore

      # ── Resolve the release tag ──────────────────────────────────────────────
      # Manual dispatch with an explicit tag  → use it as-is.
      # Manual dispatch without a tag         → v{versionName}.
      # Automatic push                        → v{versionName}.
      # Existing releases and tags are preserved for auditability and rollback.
      - name: Resolve release tag
        id: tag
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | grep -oP '"\K[^"]+')

          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="v${VERSION_NAME}"
          fi

          echo "name=${TAG}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved release tag: ${TAG}"

      # SC-04: Publish a tamper-evident SHA-256 manifest alongside the APKs.
      - name: Generate APK SHA-256 checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── Publish the new release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ steps.tag.outputs.name }}
          name:                 "DuoShield ${{ steps.tag.outputs.name }}"
          generate_release_notes: true
          body: |
            ## Installation

            Pick the APK for your device architecture:

            | File | Architecture | Devices |
            |---|---|---|
            | `app-arm64-v8a-release.apk` | 64-bit | Most phones from 2017 onwards |
            | `app-armeabi-v7a-release.apk` | 32-bit | Older / budget devices |

            Enable **Install from unknown sources** in Settings → Security, then tap the APK to install.

            ---
            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
