name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.3.1). Leave blank to use versionName from build.gradle.'
        required: false
        type: string

# Only one release job runs at a time; a newer push cancels an in-progress build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create/delete releases and tags

jobs:
  release:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required for a release build."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # S08-C1: no service-account.json is written into app/src/main/assets any
      # more. That step used to place the project's Firebase **admin** private
      # key inside the packaged APK, where `unzip -p app.apk assets/…` recovered
      # full Admin SDK authority over every user's Firestore data and Auth
      # tokens from a public download. No application code ever read the file —
      # verified by grepping app/src for `service-account` — so the step existed
      # purely as a leak. Admin credentials live only on the push server (Render
      # env) and the Cloudflare Worker. Never reintroduce this step: an APK is a
      # public artifact, so anything written into it is published, not stored.
      #
      # SC-02 / S08-H1: the release local.properties below deliberately carries
      # NO secret material either — only non-secret endpoints. B2 keys and
      # WORKER_SECRET used to be injected here and compiled into BuildConfig,
      # which shipped the shared storage credential to every device. Media
      # access is now brokered by per-object capability tokens minted by the
      # push server (SEC-A01, see B2StorageHelper), so the client needs neither.
      #
      # Rule for this file: a value may only be written into local.properties if
      # it would be safe to print on the release page. If it must stay secret,
      # it belongs in a server env var and must be reached over an authenticated
      # endpoint at runtime.
      - name: Write local.properties (non-secret values only)
        env:
          B2_BUCKET:       ${{ secrets.B2_BUCKET }}
          B2_REGION:       ${{ secrets.B2_REGION }}
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          WORKER_URL:      ${{ secrets.WORKER_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"                                                     > local.properties
          echo "b2.bucket=${B2_BUCKET:-duoshield-cold}"                                       >> local.properties
          echo "b2.region=${B2_REGION:-eu-central-003}"                                       >> local.properties
          echo "push.server.url=${PUSH_SERVER_URL:-https://duofat.onrender.com}"              >> local.properties
          echo "worker.url=${WORKER_URL:-https://duoshield-storage.kumarclaude4.workers.dev}" >> local.properties

      # Fail the release if any known secret name reached a packaged input.
      # This is the enforcement half of the rule above: comments do not stop a
      # future edit from re-adding an injection step, a failing build does.
      - name: Assert no secrets in packaged build inputs
        run: |
          set -u
          fail=0
          # Note: `set -e` is deliberately NOT used. Under `-e` a missing
          # local.properties would abort this step before any check ran, so the
          # guard would be skipped rather than enforced — the failure mode a
          # secret check must never have. Every condition is tested explicitly
          # and the exit status is decided at the end.
          if [ ! -f local.properties ]; then
            echo "::error::local.properties is missing — cannot verify the build carries no secrets."
            exit 1
          fi
          if [ -f app/src/main/assets/service-account.json ]; then
            echo "::error::app/src/main/assets/service-account.json exists — admin credentials must never be packaged (S08-C1)."
            fail=1
          fi
          # `=.` requires at least one character after the `=`, so a key written
          # with an empty value (the `${VAR:-}` default) is correctly allowed
          # while any real value trips the guard.
          for key in b2.key.id b2.application.key worker.secret; do
            if grep -q "^${key}=." local.properties; then
              echo "::error::local.properties sets ${key} — client builds must not carry shared secrets (SC-02)."
              fail=1
            fi
          done
          # Catch a credential smuggled in under any other key name: B2
          # application keys are long opaque strings, and a Google private key
          # block is unmistakable.
          if grep -qi "BEGIN [A-Z ]*PRIVATE KEY" local.properties; then
            echo "::error::local.properties contains a private key block."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: no packaged secret material detected."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign release APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/duoshield-release.keystore

      - name: Build signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Erase keystore from runner disk
        if: always()
        run: rm -f app/duoshield-release.keystore

      # ── Resolve the release tag ──────────────────────────────────────────────
      # SC-05: releases and tags are permanent audit records now — nothing
      # deletes them (see the removed "Delete all previous releases and tags"
      # step below this comment's former location). That makes a rolling tag
      # unsafe: if every automatic push reused `v{versionName}`, an unchanged
      # version would just fail to publish a second time (the tag already
      # exists) instead of silently overwriting history, which is correct but
      # not useful. So every automatic push gets a tag that names the exact
      # commit it was built from — `v{versionName}+{short-sha}` — per the
      # audit's recommendation, so a tag always identifies exactly one binary
      # and "DuoShield v1.3.1" is never ambiguous again. Manual dispatch may
      # still supply an explicit tag (e.g. for a curated `v1.3.1` marker once a
      # version is final) and is trusted as-is since a human chose it.
      - name: Resolve release tag
        id: tag
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | grep -oP '"\K[^"]+')
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="v${VERSION_NAME}+${SHORT_SHA}"
          fi

          echo "name=${TAG}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved release tag: ${TAG}"

      # ── Generate checksums + capture the signing certificate fingerprint ────
      # SC-04: releases previously shipped with no way to verify a downloaded
      # APK against what was actually built. SHA256SUMS lets a user check the
      # file they downloaded; the signing certificate SHA-256 (printed into the
      # release body below) lets them additionally confirm it was signed by
      # the same key as prior releases, independent of any single GitHub
      # download being trustworthy.
      - name: Generate checksums and certificate fingerprint
        id: verify
        run: |
          cd app/build/outputs/apk/release
          sha256sum ./*.apk > SHA256SUMS
          cat SHA256SUMS
          cd - > /dev/null

          FIRST_APK=$(find app/build/outputs/apk/release -name '*.apk' | sort | head -n1)
          FINGERPRINT=$("$ANDROID_SDK_ROOT"/build-tools/*/apksigner verify --print-certs "$FIRST_APK" \
            | grep -m1 'SHA-256 digest' | sed -E 's/.*:\s*//')

          {
            echo "fingerprint<<EOF"
            echo "${FINGERPRINT:-unavailable — apksigner did not report a SHA-256 digest}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Publish the new release (immutable — never deleted by this workflow) ─
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ steps.tag.outputs.name }}
          name:                 "DuoShield ${{ steps.tag.outputs.name }}"
          generate_release_notes: true
          body: |
            ## Installation

            Pick the APK for your device architecture:

            | File | Architecture | Devices |
            |---|---|---|
            | `app-arm64-v8a-release.apk` | 64-bit | Most phones from 2017 onwards |
            | `app-armeabi-v7a-release.apk` | 32-bit | Older / budget devices |

            Enable **Install from unknown sources** in Settings → Security, then tap the APK to install.

            ## Verify what you downloaded

            Checksums for this release's APKs are in `SHA256SUMS` below. The signing certificate
            SHA-256 fingerprint for this build is:

            ```
            ${{ steps.verify.outputs.fingerprint }}
            ```

            Compare it against `apksigner verify --print-certs <apk>` after downloading, and against
            the fingerprint printed on prior releases — it should never change between releases.

            ---
            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
