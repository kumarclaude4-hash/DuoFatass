name: Firestore emulator integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-integration:
    name: Server Firestore integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run all Firestore integration suites against an isolated demo project
        working-directory: server
        env:
          GCLOUD_PROJECT: demo-duoshield-ci
          DUOSHIELD_REQUIRE_FIRESTORE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@15.35.0 emulators:exec
          --project demo-duoshield-ci
          --only firestore
          --config ../firebase.json
          "npm run test:firestore-integration"
