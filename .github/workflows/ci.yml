name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Server and Worker code is part of the security boundary too. Run both
  # complete Node test suites on every PR/push; Android-only CI must not be
  # the sole test gate for authentication, token and Durable Object changes.
  backend-tests:
    name: Server + Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            worker/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run complete server test suite
        working-directory: server
        run: npm test

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run complete Worker test suite
        working-directory: worker
        run: npm test

  # SC-01: gate the vendored libsignal JAR before anything builds with it.
  #
  # app/build.gradle ships `libs/libsignal-client-0.54.1-stripped.jar` as an
  # `implementation files(...)` dependency (the Maven artifact is only
  # `compileOnly`), so the Signal Protocol classes users actually execute — the
  # app's entire confidentiality guarantee — come from that committed 38 MB blob.
  # Gradle applies no integrity checking to `files(...)` dependencies, the JAR is
  # not built in CI, and nobody reviews a 38 MB binary diff in a pull request. A
  # commit swapping it for a build with a modified SessionCipher or a
  # key-generation routine that leaks entropy would compromise every message in
  # the product and look like a routine dependency bump.
  #
  # This job asserts the file still hashes to the value recorded in
  # scripts/strip_signal_records.py and app/libs/*.jar.sha256. Changing the JAR
  # now requires updating those records in the same commit, which is the
  # reviewable signal that was missing. It is a separate job that every build job
  # `needs`, so an unexpected JAR fails the pipeline BEFORE it is compiled,
  # dexed, packaged, or uploaded as an artifact — not after.
  verify-libsignal-jar:
    name: Verify vendored libsignal JAR (SC-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Hash check only — no network, no Gradle, no Android SDK. Keeping this
      # dependency-free is deliberate: the integrity gate for the crypto core
      # should not itself depend on a toolchain that could fail open.
      - name: Assert vendored libsignal JAR matches recorded hash
        run: python3 scripts/strip_signal_records.py --check

  # SC-07: the Gradle wrapper JAR (gradle/wrapper/gradle-wrapper.jar) is an
  # executable binary committed to the repo and run by `./gradlew` on every CI
  # build and every developer machine. A tampered wrapper JAR executes arbitrary
  # code with the build's privileges before any dependency is even resolved, and
  # a 63 KB binary diff is not something a reviewer catches by eye. This job
  # validates that the committed wrapper JAR matches an official Gradle release
  # checksum. Like verify-libsignal-jar it is a prerequisite of `lint`, so every
  # build job inherits the gate and a bad wrapper fails before it can run.
  validate-gradle-wrapper:
    name: Validate Gradle wrapper JAR (SC-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [verify-libsignal-jar, validate-gradle-wrapper]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub for lint."
            cat app/google-services.json.template > app/google-services.json
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --continue

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [verify-libsignal-jar, validate-gradle-wrapper]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub for unit tests."
            cat app/google-services.json.template > app/google-services.json
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub."
            cat app/google-services.json.template > app/google-services.json
          fi

      # SC-02: no B2 credential is exposed to this job. It previously mapped
      # secrets.B2_KEY_ID / B2_APPLICATION_KEY into the environment and wrote
      # them to local.properties, even though a debug build never uses them —
      # the client obtains per-object capability tokens from the push server
      # instead (SEC-A01).
      #
      # This job runs on pull requests, so its exposure surface is much wider
      # than the release job's: every CI run pulled the live storage master
      # credential into a runner, a Gradle daemon, and the build cache in order
      # to compile code that ignores it. Non-secret routing values only.
      - name: Write local.properties (non-secret values only)
        env:
          B2_BUCKET:       ${{ secrets.B2_BUCKET }}
          B2_REGION:       ${{ secrets.B2_REGION }}
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          WORKER_URL:      ${{ secrets.WORKER_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"                                                     > local.properties
          echo "b2.bucket=${B2_BUCKET:-duoshield-cold}"                                       >> local.properties
          echo "b2.region=${B2_REGION:-eu-central-003}"                                       >> local.properties
          echo "push.server.url=${PUSH_SERVER_URL:-https://duofat.onrender.com}"              >> local.properties
          echo "worker.url=${WORKER_URL:-https://duoshield-storage.kumarclaude4.workers.dev}" >> local.properties

      # S08-C1 / SC-02 / S08-H1: enforce the same "no packaged secret" guarantee
      # here that release.yml enforces. This job runs on every pull request and
      # uploads the resulting debug APK as an artifact, so a secret smuggled
      # into local.properties (and thence BuildConfig/the APK) would leak just
      # as surely as from a release. Comments in build.gradle/local.properties
      # do not stop a future edit from re-adding an injection step — a failing
      # build does. Mirror of release.yml's guard step; keep both in sync.
      - name: Assert no secrets in packaged build inputs
        run: |
          set -u
          fail=0
          # `set -e` is deliberately NOT used: under -e a missing
          # local.properties would abort before any check ran, skipping the
          # guard entirely — the one failure mode a secret check must not have.
          if [ ! -f local.properties ]; then
            echo "::error::local.properties is missing — cannot verify the build carries no secrets."
            exit 1
          fi
          if [ -f app/src/main/assets/service-account.json ]; then
            echo "::error::app/src/main/assets/service-account.json exists — admin credentials must never be packaged (S08-C1)."
            fail=1
          fi
          # `=.` requires at least one character after `=`, so an empty value
          # (the ${VAR:-} default) is allowed while any real value trips it.
          for key in b2.key.id b2.application.key worker.secret; do
            if grep -q "^${key}=." local.properties; then
              echo "::error::local.properties sets ${key} — client builds must not carry shared secrets (SC-02/S08-H1)."
              fail=1
            fi
          done
          if grep -qi "BEGIN [A-Z ]*PRIVATE KEY" local.properties; then
            echo "::error::local.properties contains a private key block."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: no packaged secret material detected."

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DuoShield-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented-tests:
    name: Instrumented tests (Espresso)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub."
            cat app/google-services.json.template > app/google-services.json
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Instrumented tests need a real (emulated) device. GitHub-hosted Ubuntu
      # runners have nested-virtualization hardware but KVM access is disabled
      # by default — this is the standard enablement snippet recommended by
      # reactivecircus/android-emulator-runner for Linux runners.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator needs the command-line tools on PATH so the runner action
      # can invoke avdmanager/sdkmanager/emulator. Without this the action can
      # fail to provision the AVD and then time out waiting on a device that
      # was never created ("No compatible devices connected").
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google no longer serves the legacy `tools` package, which is the
          # default requested by this pinned action revision.
          packages: 'platform-tools'

      # AVD snapshot cache. The cache is only restored on an exact key hit, so
      # the key must encode every AVD-defining property (api-level, target,
      # arch). A stale/partial restore is worse than no cache: the runner is
      # then told an AVD exists (force-avd-creation: false) when the snapshot
      # is unusable, which surfaces as
      # "Failed to start Emulator console for 5554".
      - name: Cache AVD
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-aosp_atd-x86_64-v2

      # Create the AVD once and snapshot it, WITHOUT running any test. This
      # separates "provision the device" from "run the tests", so a
      # provisioning failure is reported as a provisioning failure instead of
      # as a mysterious test-task error. Runs only on a cache miss.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # api-level/target/arch/profile MUST match the snapshot step above,
          # or the cached AVD does not apply to this run.
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Prove a device is actually present and finished booting BEFORE
          # handing control to Gradle. If this fails the job fails here with a
          # clear device-level cause, rather than inside the test task.
          script: |
            adb devices
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb shell getprop ro.build.version.sdk
            # -PdisableAbiSplits: the app's ABI splits only build arm64-v8a/
            # armeabi-v7a APKs, which excludes the x86_64 CI emulator entirely
            # and is exactly why Gradle reported "0 of which were compatible."
            # This flag falls back to a universal APK containing every ABI so
            # the test build actually installs on the emulator.
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -PdisableAbiSplits

      # Fail the job if the test task "succeeded" without actually executing any
      # test. connectedDebugAndroidTest can exit 0 on an empty run, which would
      # otherwise show up as a green Espresso job that tested nothing.
      - name: Verify Espresso tests actually executed
        if: always()
        run: |
          RESULTS_DIR=app/build/outputs/androidTest-results/connected
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "::error::No instrumentation results directory — tests did not run."
            exit 1
          fi
          # AGP writes connectedDebugAndroidTest's TEST-*.xml files one level
          # deeper than this, inside a per-device subdirectory (e.g.
          # connected/<device-name>/TEST-*.xml) — never directly under
          # connected/. A non-recursive "$RESULTS_DIR"/*.xml glob therefore
          # matches nothing on every run, silently defaulting TOTAL to 0 and
          # failing the job even when every test actually passed. find -name
          # is used instead so nested result files are counted correctly.
          TOTAL=$(find "$RESULTS_DIR" -name '*.xml' -exec grep -ho 'tests="[0-9]*"' {} + 2>/dev/null \
                  | grep -o '[0-9]*' | paste -sd+ - | bc)
          TOTAL=${TOTAL:-0}
          echo "Espresso tests executed: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Instrumentation ran 0 tests — treating as failure."
            exit 1
          fi

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
