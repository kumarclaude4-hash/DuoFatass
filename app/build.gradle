plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

android {
    namespace "com.duoshield.app"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.duoshield.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep DuoShield's supported app-language resources while still stripping the many
        // unused locales bundled by Firebase, Material, and other dependencies.
        // Urdu is deliberately not offered.
        resConfigs "en", "ar", "bn", "de", "es", "fr", "hi", "id", "it", "ja",
                "ko", "pt-rBR", "ru", "tr", "vi", "zh-rCN"

        // ndk.abiFilters removed — splits.abi block below handles ABI restriction.
        // Having both simultaneously causes a Gradle configuration conflict.

        // B2 — bucket/region only. These two are non-secret routing values.
        //
        // SC-02: the credential pair is deliberately NOT read here. Previously
        // `b2.key.id` / `b2.application.key` were resolved from local.properties
        // or the environment, which pulled the live B2 master credential into
        // the Gradle process on every build — one careless `buildConfigField`
        // away from being compiled into a public APK, and recoverable from any
        // build scan or cached Gradle log even while unused. The safest place
        // for a secret the client does not need is nowhere near the client
        // build, so the lookup itself is gone, not just its output.
        def b2Bucket  = (localProps.getProperty('b2.bucket',          '') ?: '').trim()
        def b2Region  = (localProps.getProperty('b2.region',          '') ?: '').trim()
        if (b2Bucket.isEmpty())  b2Bucket  = (System.getenv('B2_BUCKET')          ?: 'yyush-duoshield').trim()
        if (b2Region.isEmpty())  b2Region  = (System.getenv('B2_REGION')          ?: 'eu-central-003').trim()
        def b2Endpoint = "https://s3.${b2Region}.backblazeb2.com"
        // F9 fix: B2 credentials removed from APK — server generates presigned
        // URLs instead.  Fields kept as empty strings for compile compatibility;
        // B2StorageHelper detects isEmpty() and switches to the presigned path.
        buildConfigField "String", "B2_KEY_ID",          "\"\""
        buildConfigField "String", "B2_APPLICATION_KEY", "\"\""
        buildConfigField "String", "B2_BUCKET",          "\"${b2Bucket}\""
        buildConfigField "String", "B2_REGION",          "\"${b2Region}\""
        buildConfigField "String", "B2_ENDPOINT",        "\"${b2Endpoint}\""

        def pushServerUrl = (localProps.getProperty('push.server.url', '') ?: '').trim()
        if (pushServerUrl.isEmpty()) pushServerUrl = (System.getenv('PUSH_SERVER_URL') ?: '').trim()
        if (pushServerUrl.isEmpty()) pushServerUrl = 'https://duofat.onrender.com'
        buildConfigField "String", "PUSH_SERVER_URL", "\"${pushServerUrl}\""

        // Cloudflare Worker URL for tiered storage (R2 hot → B2 cold).
        // When non-empty, ALL media PUT/GET/DELETE calls route through this Worker
        // instead of going directly to B2 — no SigV4 signing needed on the device.
        // Set in local.properties as `worker.url=https://…workers.dev`
        // or via the WORKER_URL environment variable.
        def workerUrl = (localProps.getProperty('worker.url', '') ?: '').trim()
        if (workerUrl.isEmpty()) workerUrl = (System.getenv('WORKER_URL') ?: '').trim()
        buildConfigField "String", "WORKER_URL", "\"${workerUrl}\""

        // S08-H1 / SC-02: BuildConfig.WORKER_SECRET is gone, along with the
        // local.properties and environment lookups that fed it.
        //
        // The Worker's shared bearer token was compiled into every APK, so a
        // single `strings`/`apktool` pass over a public release recovered an
        // operator credential that authorised media PUT/GET/DELETE — and the
        // /stats view — for the entire bucket, not just the extracting user's
        // own objects. Rotating it was also useless in practice, because the
        // replacement had to be shipped to clients in the next APK, i.e.
        // published again.
        //
        // Client media access is now brokered per object: the push server mints
        // a short-lived capability token scoped to one key and one verb, which
        // the Worker verifies (SEC-A01, see B2StorageHelper). WORKER_SECRET
        // remains a server/operator-only secret held in the Worker's own
        // Wrangler secret store, and the Worker fails closed when it is unset.
        // Verified: no Java source references BuildConfig.WORKER_SECRET.

        // TURN credentials are now fetched at runtime from the push server
        // (/turnCredentials endpoint) using TURN_TOKEN_ID + TURN_API_TOKEN
        // server-side env vars. Nothing is baked into the APK.
    }

    signingConfigs {
        release {
            // Credentials read from Replit Secrets (env vars) at build time.
            // The keystore binary is written to app/duoshield-release.keystore by the
            // assembleRelease workflow before Gradle runs (base64-decoded from KEYSTORE_BASE64).
            def ksFile = rootProject.file('app/duoshield-release.keystore')
            def ksPwd  = System.getenv('KEYSTORE_PASSWORD')
            def kAlias = System.getenv('KEY_ALIAS')
            def kPwd   = System.getenv('KEY_PASSWORD')
            if (ksFile.exists() && ksPwd != null) {
                storeFile     ksFile
                storePassword ksPwd.trim()
                keyAlias      kAlias != null ? kAlias.trim().toLowerCase() : ''
                keyPassword   kPwd   != null ? kPwd.trim()   : ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // ndk.abiFilters omitted: splits.abi handles per-ABI APK delivery.
            // Adding abiFilters here conflicts with the splits configuration.
        }
        debug {
            minifyEnabled false
            // ndk.abiFilters omitted: splits.abi already restricts ABIs and
            // having both causes a Gradle configuration conflict.
        }
    }

    // ABI splits — produce one lean APK per CPU architecture.
    // armeabi-v7a  →  ~35% smaller for 32-bit devices
    // arm64-v8a    →  ~40% smaller for 64-bit devices (most modern phones)
    // universalApk false — no fat fallback; Play Store / manual install uses the per-ABI APK.
    //
    // CI instrumented tests boot an x86_64 emulator (GitHub-hosted Ubuntu
    // runners have no arm64 hardware acceleration), but this split list only
    // ever produced arm64-v8a/armeabi-v7a APKs. connectedDebugAndroidTest built
    // a test APK with no x86_64 binary at all, so Gradle correctly reported the
    // one connected device as "0 of which were compatible" — the ABI split
    // filtered the emulator's own architecture out of existence. Passing
    // -PdisableAbiSplits (done only by the instrumented-tests CI job) falls
    // back to Gradle's default single "universal" APK containing every ABI, so
    // the test APK matches whatever emulator/device it's installed on. Normal
    // debug builds and the signed release build are unaffected.
    def abiSplitsEnabled = !project.hasProperty('disableAbiSplits')
    splits {
        abi {
            enable abiSplitsEnabled
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            // Plain JVM unit tests (app/src/test) run against the real android.jar
            // stub, not a real device/Robolectric. Every stubbed Android method
            // throws "not mocked" by default, including android.util.Log calls
            // made incidentally by production code under test. Without this,
            // testDebugUnitTest fails on that alone, before a test's own
            // assertions ever run.
            returnDefaultValues true

            // Required by the Robolectric-backed suites (see the Robolectric
            // dependency comment below): Robolectric needs the merged resources,
            // assets and manifest on the unit-test classpath to boot its Android
            // runtime. Harmless for the plain JUnit suites.
            includeAndroidResources true
        }
    }

    lint {
        abortOnError false
        checkDependencies false
    }

    packaging {
        resources {
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                // libsignal-client bundles desktop runtime artifacts in its JAR.
                // Android can never load these; excluding them changes no app code
                // or cryptographic behavior and avoids shipping macOS/Windows payloads.
                //
                // These binaries sit at the JAR ROOT with no lib/<abi>/ prefix, so AGP
                // classifies them as Java *resources* and the jniLibs filter below can
                // never see them — that filter only applies to the native-library
                // domain. They have to be excluded here or they ride along in every
                // APK. Both the bare and the '**/' spelling are listed so the
                // exclusion holds however the matcher anchors a root-level entry.
                //
                // The arch-suffixed '.so' glob is what removes the real payload:
                //   libsignal_jni_amd64.so          68.7 MB  Linux x86-64
                //   libsignal_jni_testing_amd64.so  11.9 MB  Linux x86-64, test-only
                // = 80.5 MB of code an ARM Android device cannot even load.
                //
                // This cannot touch the library the app actually uses. Android's is
                // 'libsignal_jni.so' — no arch suffix, because the ABI is carried by
                // its jni/<abi>/ directory — and it arrives from the separate
                // libsignal-android AAR in the jniLibs domain. The pattern is
                // deliberately a suffix glob rather than a list of exact filenames so
                // a future libsignal bump cannot silently reintroduce a new desktop
                // arch (e.g. a Linux aarch64 build) under a name nobody thought to add.
                'libsignal_jni_*.so',
                '**/libsignal_jni_*.so',
                '*.dylib',
                '**/*.dylib',
                '*.dll',
                '**/*.dll'
            ]
        }
        // Keep only libsignal's production Android JNI library. The testing JNI
        // artifact exposes test-only native hooks and is never referenced by main code.
        // Production libsignal, WebRTC and SQLCipher libraries remain untouched.
        //
        // useLegacyPackaging = true DEFLATEs the retained .so files in the APK.
        //
        // Do NOT set android:extractNativeLibs in AndroidManifest.xml. Since AGP 4.2
        // this flag is the single source of truth: AGP derives extractNativeLibs into
        // the merged manifest from it (true here => extractNativeLibs=true). The two
        // must agree, and letting AGP derive it is what guarantees they do. An earlier
        // revision of this comment claimed the manifest carried the value explicitly;
        // it never did, and adding it back would create exactly the drift this note
        // is warning about.
        //
        // This flag is a size trade, NOT a runtime performance trade. Both modes end
        // up with the libs mmap'd; they differ only in where the mapping comes from:
        //   - Compressed (this setting): smaller APK download. The installer extracts
        //     the libs to the app's native dir once, and the loader mmaps that copy.
        //     Cost is a one-time install-time decompression plus a second on-disk copy
        //     of every .so. Steady-state performance is unaffected.
        //   - Uncompressed (useLegacyPackaging = false): larger download, nothing is
        //     extracted, loader mmaps straight out of the APK. Smaller installed
        //     footprint, but identical runtime behaviour.
        //
        // libsignal, WebRTC and SQLCipher are large, so compressing them is a real
        // download-size win. Because neither mode costs per-launch or per-frame time,
        // the smaller download is preferred here. Do not reach for this flag when
        // chasing call smoothness or decryption latency — it cannot move either; see
        // CallManager's quality-ladder dwell guard and ChatMediaActivity's dedicated
        // crypto executor for the levers that actually govern those paths.
        //
        // NOTE: this rule governs the AAR-supplied jni/<abi>/ libraries only. The
        // desktop binaries at the libsignal-client JAR root are resources, not
        // jniLibs, and are handled by the resources excludes above — do not move
        // them here expecting them to match.
        jniLibs {
            excludes += ['**/libsignal_jni_testing.so']
            useLegacyPackaging = true
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    // NOTE: androidx.activity is deliberately NOT declared here. It resolves transitively to
    // 1.8.0 (appcompat asks for 1.6.0; something later in the graph wins the conflict), which
    // carries the OnBackPressedCallback / getOnBackPressedDispatcher() APIs. Pinning it
    // explicitly at 1.6.0 drags lifecycle-viewmodel-savedstate:2.5.1 metadata into the graph,
    // and since this build enforces Gradle dependency verification, that unverified artifact
    // fails :app:checkDebugAarMetadata. If it ever needs declaring, use 1.8.0 and regenerate
    // gradle/verification-metadata.xml in the same change.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // NOTE: androidx.gridlayout is deliberately NOT declared. The only grid in the app is
    // EmojiKeyboardHelper's emoji picker, and it uses the *framework* class
    // `android.widget.GridLayout` (see its import) — which ships in the platform and needs
    // no artifact. No layout XML references androidx.gridlayout.widget.GridLayout either, so
    // the dependency was resolved and packaged while nothing could ever load a class from
    // it. Re-add it only if a view actually switches to the AndroidX backport (needed solely
    // for API < 14), and regenerate gradle/verification-metadata.xml in the same change.


    // Security — EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room (local encrypted DB)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    // NOTE: firebase-storage is deliberately NOT declared. Media never transited Firebase
    // Storage — uploads/downloads go through the Cloudflare Worker to R2/B2 with per-object
    // capability tokens minted by the push server (see B2StorageHelper, SEC-A01). Nothing in
    // app/src referenced FirebaseStorage or StorageReference, so the SDK was dead weight, and
    // proguard-rules.pro's blanket `-keep class com.google.firebase.** { *; }` meant R8 could
    // not strip it either: it shipped whole. Re-adding it would put user media back on a
    // path governed by firestore/storage rules instead of the capability-token broker, so
    // route new media through the Worker rather than declaring this.
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'

    // S10-N1: App Check — attests that Firestore/Storage requests come from a
    // genuine build of this app, not a scripted client holding a stolen/authed
    // session (audit/SESSION-10-SYNTHESIS.md §S10-N1). Play Integrity is the
    // real-device attestor used in release builds; the Debug provider issues a
    // per-install debug token (logged once at first launch, then registered in
    // the Firebase console) so debug/CI builds are never blocked by an
    // attestation check they cannot pass. Neither line enforces anything by
    // itself — see DuoShieldApp.onCreate() for provider registration and
    // firestore.rules' appCheckVerified() for the (currently unwired,
    // monitoring-first) rules-side half.
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'



    // WorkManager for self-destruct scheduler
    implementation 'androidx.work:work-runtime:2.9.0'

    // ProfileInstaller — consumes app/src/main/baseline-prof.txt.
    //
    // Without this artifact on the runtime classpath the baseline profile is packaged into the
    // APK and then ignored: nothing triggers the ART compilation of it, so every startup runs
    // the interpreter/JIT over the same cold paths. With it, the profile is installed shortly
    // after first launch and those methods are AOT-compiled, which is where the startup win
    // comes from.
    //
    // Pinned at 1.3.0 deliberately: that exact version is already present in
    // gradle/verification-metadata.xml (it resolves transitively today), as are all three of
    // its dependencies — androidx.annotation, androidx.concurrent:concurrent-futures and
    // androidx.startup:startup-runtime. This build enforces Gradle dependency verification, so
    // declaring any other version would fail :app:checkDebugAarMetadata against unverified
    // artifacts. Bumping it means regenerating the verification metadata in the same change —
    // see the androidx.activity note above for the same trap.
    implementation 'androidx.profileinstaller:profileinstaller:1.3.0'

    // Material Design
    implementation 'com.google.android.material:material:1.11.0'

    // Glide — image loading in chat
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // PhotoView — pinch-zoom for full-screen images
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // ZXing — QR code generation + scanning
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // Signal Protocol — end-to-end encryption (Double Ratchet + X3DH)
    //
    // libsignal-android 0.54.x AAR = native .so ONLY (arm64-v8a / armeabi-v7a / x86 / x86_64).
    //                                It does NOT ship Java classes in its classes.jar.
    // libsignal-client  0.54.x JAR = all Java protocol classes (Curve, IdentityKeyPair,
    //                                SessionCipher, PreKeyBundle, etc.)
    //
    // DEPENDENCY RULES — three lines, all three required:
    //
    // 1. libsignal-android is `implementation` — provides the native JNI .so files.
    //    libsignal-client is excluded from its transitive graph so Gradle does not pull
    //    the full JAR in twice (once transitively, once via line 3 below), which would
    //    cause duplicate-class dexing errors.
    //
    // 2. libsignal-client is `compileOnly` — lets javac resolve all org.signal.* imports
    //    at compile time.  NOT included in the DEX (that is line 3's job).
    //
    // 3. libs/libsignal-client-0.54.1-stripped.jar is `implementation` — a copy of the
    //    Maven JAR with 6 java.lang.Record subclasses removed:
    //      ChatService${DebugInfo,Request,Response,ResponseAndDebugInfo}
    //      Svr3$RestoredSecret
    //      GroupSendEndorsementsResponse$ReceivedEndorsements
    //    These classes are from the libsignal.net / zkgroup packages that DuoShield never
    //    uses.  Removing them avoids the D8 crash:
    //      "Attempt to create a global synthetic for 'Record desugaring' without a consumer"
    //    which occurs because DexingNoClasspathTransform (used for external Maven JARs)
    //    runs with enableGlobalSynthetics=false and cannot desugar java.lang.Record.
    //    The stripped local file goes through a different Gradle transform path that is
    //    not subject to that restriction.
    //    To regenerate: python3 scripts/strip_signal_records.py  (see that file for details)
    //
    // 4. No DuoShield source file imports org.signal.libsignal.protocol.kdf.HKDF.
    //    SeedPhraseHelper implements RFC 5869 HKDF using javax.crypto.Mac so that
    //    this libsignal-internal class is never needed at runtime.
    implementation('org.signal:libsignal-android:0.54.1') {
        exclude group: 'org.signal', module: 'libsignal-client'
    }
    compileOnly 'org.signal:libsignal-client:0.54.1'
    implementation files('libs/libsignal-client-0.54.1-stripped.jar')

    // SQLCipher — full Room database encryption (BUG-D01).
    // AES-256-CBC per-page encryption; passphrase derived in DatabaseKeyProvider.
    // Requires net.sqlcipher artifact for the SupportFactory Room integration.
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // ExoPlayer (Media3) — full-screen encrypted video playback with basic controls
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // WebRTC — voice & video calling
    //
    // Pinned at 1.3.10 for the current Unified Plan audio/video call implementation and
    // remote-track playback support. Downgrading this dependency can break call compilation.
    //
    // Bumping this also moves two transitive pins (androidx.annotation 1.7.0 -> 1.9.1,
    // kotlin-stdlib 1.9.20 -> 1.9.25) because Gradle resolves to the highest requested
    // version. Both need checksums in gradle/verification-metadata.xml or dependency
    // verification fails the build.
    implementation 'io.getstream:stream-webrtc-android:1.3.10'

    // androidx.localbroadcastmanager — NOT used by any code in app/src, but this declaration
    // must stay: it is a version pin, not a feature dependency.
    //
    // The AAR is pulled in transitively regardless, by both
    // com.google.firebase:firebase-auth and androidx.legacy:legacy-support-core-utils
    // (via play-services-stats <- firebase-messaging, and dynamicanimation <- material).
    // Both request 1.0.0, so dropping this line does not remove the artifact from the APK —
    // it only downgrades it 1.1.0 -> 1.0.0. gradle/verification-metadata.xml pins hashes for
    // 1.1.0 only, so the downgrade fails :app:checkReleaseAarMetadata with a dependency
    // verification error. Removing it saves no bytes and breaks the release build.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Pull-to-refresh on conversation list
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'

    // Robolectric — real Android implementations for JVM unit tests.
    //
    // `returnDefaultValues true` (see testOptions above) makes every android.jar stub
    // return null/0 instead of throwing. That is what lets incidental android.util.Log
    // calls pass through harmlessly, but it also silently breaks any test whose subject
    // genuinely needs an Android class to *work*: android.util.Base64.decode() returns
    // null (so SecretKeySpec/GCMParameterSpec reject it downstream) and
    // ClipData.newPlainText() returns null. Robolectric supplies the real AOSP
    // implementations of those classes, so the affected suites are annotated
    // @RunWith(RobolectricTestRunner.class) rather than weakening their assertions.
    // Only classes that opt in pay Robolectric's startup cost; the rest still run as
    // plain fast JUnit against the stubs.
    testImplementation 'org.robolectric:robolectric:4.14.1'

    // Build and execute the real Worker#doWork() path with deterministic input and attempt counts.
    testImplementation 'androidx.work:work-testing:2.9.0'

    // Instrumented (on-device) tests — Espresso + AndroidX Test.
    // Used for regression coverage that needs the real Android runtime (real
    // AndroidKeyStore / EncryptedSharedPreferences), which app/src/test's plain
    // JVM unit tests cannot exercise. See DevicePinGateInstrumentedTest.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
}

// Assign distinct versionCodes per ABI so Play Store can distinguish split APKs.
// armeabi-v7a → 1_000_000 + versionCode; arm64-v8a → 2_000_000 + versionCode
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
        def abiCode = ['armeabi-v7a': 1, 'arm64-v8a': 2].get(abiFilter, 0)
        if (abiCode > 0) {
            output.versionCodeOverride = abiCode * 1_000_000 + variant.versionCode
        }
    }
}
